<div class="projects-page">
  <!-- Background wrapper that grows with content -->
  <div class="parallax-container" aria-hidden="true">
    <div id="parallax-image-project"></div>
    <div class="projects-veil"></div>
  </div>

  <main class="projects-shell">
    <!-- HERO -->
    <header class="projects-hero">
      <h1 class="projects-title">Projects</h1>
      <p class="projects-subtitle">
        A curated set of case studies and builds—focused on clean UI, thoughtful
        interaction, and solid engineering.
      </p>

      <div class="filters-row" aria-label="Project filters">
        <input
          id="project-search"
          class="project-search"
          type="search"
          placeholder="Search projects, tags, or dates…"
          aria-label="Search projects"
        />

        <div
          id="filter-chips"
          class="filter-chips"
          role="group"
          aria-label="Filter chips"
        >
          <!-- built in JS -->
        </div>
      </div>
    </header>

    <div class="projects-section-label">Most recent</div>

    <!-- PROJECT LIST -->
    <section id="projects-list" aria-label="Projects list">
      <!-- built in JS -->
    </section>
  </main>
</div>
